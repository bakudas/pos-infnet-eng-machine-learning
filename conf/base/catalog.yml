# Here you can define all your datasets by using simple YAML syntax.
#
# Documentation for this file format can be found in "The Data Catalog"
# Link: https://docs.kedro.org/en/stable/data/data_catalog.html

dataset_kobe_dev:
    type: pandas.ParquetDataset
    filepath: data/01_raw/dataset_kobe_dev.parquet

dataset_kobe_prod:
    type: pandas.ParquetDataset
    filepath: data/01_raw/dataset_kobe_prod.parquet

data_filtered:
    type: pandas.ParquetDataset
    filepath: data/04_feature/data_filtered.parquet

base_train:
    type: pandas.ParquetDataset
    filepath: data/05_model_input/base_train.parquet

base_test:
    type: pandas.ParquetDataset
    filepath: data/05_model_input/base_test.parquet

trained_lr_model:
  type: pickle.PickleDataset
  filepath: data/06_models/lr_model_kedro.pkl

trained_dt_model:
  type: pickle.PickleDataset
  filepath: data/06_models/dt_model_kedro.pkl

best_model:
  type: pickle.PickleDataset
  filepath: data/06_models/best_model_kedro.pkl

split_train_size:
    type: kedro_mlflow.io.metrics.MlflowMetricDataset

split_test_size:
    type: kedro_mlflow.io.metrics.MlflowMetricDataset

base_test_lr_metrics:
    type: kedro_mlflow.io.metrics.MlflowMetricsHistoryDataset

base_test_dt_metrics:
    type: kedro_mlflow.io.metrics.MlflowMetricsHistoryDataset

predictions:
    type: pandas.ParquetDataset
    filepath: data/07_model_output/predictions.parquet

report_status:
  type: MemoryDataset

predictions_metrics:
    type: kedro_mlflow.io.metrics.MlflowMetricsHistoryDataset

roc_auc_plot:
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: matplotlib.MatplotlibWriter
    filepath: data/08_reporting/roc_auc_plot.png